<mat-toolbar color="primary" class="navbar">
  <span class="brand" routerLink="/colony">🚀 Space Colony</span>
  <span class="spacer"></span>

  @if (auth.isLoggedIn()) {
    <span class="username">{{ auth.currentUser()?.username }}</span>
    <button mat-icon-button (click)="auth.logout()" title="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<router-outlet />
